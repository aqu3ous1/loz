<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Legend of Zelda: Descendants</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101018'/%3E%3Cpath d='M8 2 L10 6 L14 8 L10 10 L8 14 L6 10 L2 8 L6 6 Z' fill='%23d8c078'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #05060a; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: #cfd6e6;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#screen {
    image-rendering: pixelated; image-rendering: crisp-edges;
    display: block; background: #000; touch-action: none; outline: none;
    box-shadow: 0 0 0 2px #14161f, 0 0 60px rgba(0,0,0,0.9);
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: #05060a; z-index: 20;
    text-align: center; padding: 24px; letter-spacing: 0.06em;
  }
  #boot h1 { font-size: 15px; font-weight: 600; margin: 0; color: #d8c98a; }
  #boot p  { font-size: 11px; margin: 0; color: #7d879c; max-width: 34em; line-height: 1.7; }
  #boot button {
    margin-top: 8px; background: #1a1f2e; color: #e6ecf8;
    border: 1px solid #3b445e; padding: 10px 22px; font: inherit; font-size: 12px;
    letter-spacing: 0.12em; cursor: pointer; border-radius: 2px;
  }
  #boot button:hover { background: #26304a; color: #fff; }
  #err { position: fixed; inset: 0; background: #12060a; color: #ffb4b4; padding: 24px;
         font-size: 12px; white-space: pre-wrap; overflow: auto; z-index: 40; display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="960" height="720" tabindex="0"></canvas></div>

<div id="boot">
  <h1>THE LEGEND OF ZELDA: DESCENDANTS</h1>
  <p id="bootmsg">Generating cartridge data&hellip;</p>
  <button id="bootbtn" style="display:none">PRESS START</button>
</div>
<div id="err"></div>
